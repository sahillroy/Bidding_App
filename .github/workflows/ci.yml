name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a branch is pushed again. Saves minutes and
# means the latest commit is always the one whose status you are reading.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what package-lock.json specifies and fails if
      # the lockfile is out of sync with package.json. `npm install` would
      # silently resolve new versions, which defeats the point of a lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      # Guard against anyone reintroducing document-number storage.
      # See implementationplan.md §2.1 and §15.
      - name: Compliance guard
        run: npm run check:compliance

      - name: Build
        env:
          # The build must succeed without real secrets. Anything that needs a
          # live Supabase connection at build time is a design error: public
          # pages are rendered at request time, not baked at build time.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npm run build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fail on high or critical only. Moderate findings in build-time-only
      # tooling are triaged in docs/SECURITY_NOTES.md rather than blocking work.
      - run: npm audit --audit-level=high
